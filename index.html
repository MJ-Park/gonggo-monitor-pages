<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공지원사업 공고 현황 — 2026-09-04</title>
<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
  --new: #059669;
  --upd: #d97706;
  --fail: #dc2626;
  --ok: #059669;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px 48px;
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-size: 1.55rem; margin: 0 0 8px; letter-spacing: -0.02em; }
.explainer {
  color: var(--muted);
  font-size: 0.92rem;
  margin: 0 0 20px;
  max-width: 52rem;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.card .label { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.card .value { font-size: 1.45rem; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.82rem;
  border: 1px solid var(--border);
  background: var(--card);
}
.chip.ok { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
.chip.fail { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  align-items: center;
}
.filters input, .filters select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.9rem;
  background: var(--card);
}
.filters input { min-width: 220px; flex: 1; }
.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: auto;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td {
  padding: 10px 12px;
  text-align: left;
  font-size: 0.88rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
th {
  background: #f9fafb;
  position: sticky;
  top: 0;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
th:hover { background: #f3f4f6; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8fafc; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge.new { background: #d1fae5; color: #065f46; }
.badge.upd { background: #ffedd5; color: #9a3412; }
.muted { color: var(--muted); }
.empty { color: var(--muted); }
a.link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  white-space: nowrap;
}
a.link:hover { text-decoration: underline; }
.meta { font-size: 0.8rem; color: var(--muted); margin-top: 14px; }
.title-cell { font-weight: 500; max-width: 320px; }
.summary-cell { max-width: 240px; color: #374151; }
#count { font-size: 0.85rem; color: var(--muted); margin-left: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>공공지원사업 공고 현황 — 2026-09-04</h1>
  <p class="explainer">
    오늘 모니터가 잡아낸 <strong>신규·변경</strong> 공고 목록입니다.
    관련도로 숨기지 않으며, 각 행에서 원문 링크로 확인할 수 있습니다.
    날짜·기관이 비어 있으면 「미확인」으로 표시합니다.
  </p>

  <div class="cards">
    <div class="card"><div class="label">신규</div><div class="value" style="color:var(--new)">1</div></div>
    <div class="card"><div class="label">변경</div><div class="value" style="color:var(--upd)">8</div></div>
    <div class="card"><div class="label">확인한 공고 합계</div><div class="value">500</div></div>
    <div class="card"><div class="label">소스 실패</div><div class="value" style="color:var(--text)">0</div></div>
    <div class="card"><div class="label">마감 7일 이내</div><div class="value">0</div></div>
  </div>

  <div class="chips">
    <span class="chip ok" data-source="kstartup">K-Startup · OK</span><span class="chip ok" data-source="bizinfo">기업마당 · OK</span><span class="chip ok" data-source="iris">IRIS · OK</span><span class="chip ok" data-source="ntis">NTIS · OK</span><span class="chip ok" data-source="smtech">SMTECH · OK</span>
  </div>

  <div class="filters">
    <input id="q" type="search" placeholder="검색 (제목·기관·요지…)" aria-label="검색">
    <select id="kind" aria-label="상태">
      <option value="">전체 상태</option>
      <option value="NEW">신규</option>
      <option value="UPDATED">변경</option>
    </select>
    <select id="source" aria-label="출처">
      <option value="">전체 출처</option><option value="kstartup">K-Startup</option><option value="bizinfo">기업마당</option><option value="iris">IRIS</option><option value="ntis">NTIS</option><option value="smtech">SMTECH</option>
    </select>
    <span id="count"></span>
  </div>

  <div class="table-wrap">
    <table id="idx">
      <thead>
        <tr>
          <th data-col="0">구분</th>
          <th data-col="1">출처</th>
          <th data-col="2">제목</th>
          <th data-col="3">기관</th>
          <th data-col="4">게시일</th>
          <th data-col="5">마감일</th>
          <th data-col="6">한줄 요지</th>
          <th>원문 보기</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="meta">데이터 기준일(KST): 2026-09-04 · 빈 값은 「미확인」</p>
</div>
<script id="data" type="application/json">[{"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년도 제3차 중소벤처기업부 혁신제품 지정기간 연장(1차) 공고", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02869&buclCd=S9112&dtlAncmSn=1&schdSe=MO5005&aplySn=1&searchCondition=&searchKeyword=&pageIndex=1"}, {"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년도 제2차 중소벤처기업부 혁신제품 지정기간 연장(2차) 공고", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02870&buclCd=S9112&dtlAncmSn=1&schdSe=MO5005&aplySn=1&searchCondition=&searchKeyword=&pageIndex=1"}, {"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년 중소기업 연구인력지원사업(채용, 고경력) 공고", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02833&buclCd=S6043&dtlAncmSn=1&schdSe=MO5005&aplySn=1&searchCondition=&searchKeyword=&pageIndex=3"}, {"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년 중소기업 연구인력지원사업(채용, 신진) 공고", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02834&buclCd=S6042&dtlAncmSn=1&schdSe=MO5005&aplySn=1&searchCondition=&searchKeyword=&pageIndex=3"}, {"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년 지역기업 성장사다리 지원사업(세종)", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02850&buclCd=S801A&dtlAncmSn=1&schdSe=MO5005&aplySn=2&searchCondition=&searchKeyword=&pageIndex=3"}, {"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년 지역기업 성장사다리 지원사업(지원)", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02848&buclCd=S8018&dtlAncmSn=1&schdSe=MO5005&aplySn=2&searchCondition=&searchKeyword=&pageIndex=3"}, {"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년 지역혁신선도기업육성(R&D)-지역기업 역량강화 지원계획 공고", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02844&buclCd=S6582&dtlAncmSn=1&schdSe=MO5005&aplySn=1&searchCondition=&searchKeyword=&pageIndex=3"}, {"kind": "UPDATED", "kind_ko": "변경", "source_id": "smtech", "source_label": "SMTECH", "title": "2026년 지역혁신선도기업육성(R&D)-주력산업 생태계 구축 지원계획 공고", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02843&buclCd=S6581&dtlAncmSn=1&schdSe=MO5005&aplySn=1&searchCondition=&searchKeyword=&pageIndex=3"}, {"kind": "NEW", "kind_ko": "신규", "source_id": "smtech", "source_label": "SMTECH", "title": "2025년도 지역혁신생태계 구축사업(수도권) 공고", "issuer": "", "posted_at": "", "deadline": "", "summary": "", "detail_url": "https://www.smtech.go.kr/front/ifg/no/notice02_detail.do?buclYy=&ancmId=S02794&buclCd=S8111&dtlAncmSn=1&schdSe=MO5005&aplySn=2&searchCondition=&searchKeyword=&pageIndex=7"}]</script>
<script>
(function() {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var tbody = document.getElementById('tbody');
  var qEl = document.getElementById('q');
  var kindEl = document.getElementById('kind');
  var sourceEl = document.getElementById('source');
  var countEl = document.getElementById('count');
  var sortCol = null;
  var sortAsc = true;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function disp(s) {
    var v = (s || '').trim();
    return v ? esc(v) : '<span class="empty">미확인</span>';
  }
  function badge(kind) {
    if (kind === 'NEW') return '<span class="badge new">신규</span>';
    if (kind === 'UPDATED') return '<span class="badge upd">변경</span>';
    return esc(kind);
  }
  function filtered() {
    var q = (qEl.value || '').toLowerCase().trim();
    var kind = kindEl.value;
    var source = sourceEl.value;
    return DATA.filter(function(r) {
      if (kind && r.kind !== kind) return false;
      if (source && r.source_id !== source) return false;
      if (!q) return true;
      var blob = [r.kind_ko, r.source_label, r.title, r.issuer, r.posted_at, r.deadline, r.summary].join(' ').toLowerCase();
      return blob.indexOf(q) >= 0;
    });
  }
  function render() {
    var rows = filtered();
    if (sortCol !== null) {
      var keys = ['kind_ko','source_label','title','issuer','posted_at','deadline','summary'];
      var key = keys[sortCol];
      rows = rows.slice().sort(function(a,b) {
        var x = (a[key] || ''), y = (b[key] || '');
        var cmp = x.localeCompare(y, 'ko');
        return sortAsc ? cmp : -cmp;
      });
    }
    countEl.textContent = '표시 ' + rows.length + ' / 전체 ' + DATA.length;
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="muted">조건에 맞는 공고가 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function(r) {
      return '<tr>'
        + '<td>' + badge(r.kind) + '</td>'
        + '<td>' + esc(r.source_label) + '</td>'
        + '<td class="title-cell">' + esc(r.title) + '</td>'
        + '<td>' + disp(r.issuer) + '</td>'
        + '<td>' + disp(r.posted_at) + '</td>'
        + '<td>' + disp(r.deadline) + '</td>'
        + '<td class="summary-cell">' + (r.summary ? esc(r.summary) : '<span class="empty">미확인</span>') + '</td>'
        + '<td><a class="link" href="' + esc(r.detail_url) + '" target="_blank" rel="noopener">원문 보기</a></td>'
        + '</tr>';
    }).join('');
  }
  qEl.addEventListener('input', render);
  kindEl.addEventListener('change', render);
  sourceEl.addEventListener('change', render);
  document.querySelectorAll('th[data-col]').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = parseInt(th.getAttribute('data-col'), 10);
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
