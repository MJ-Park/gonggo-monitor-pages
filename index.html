<style>
:root {
  --bg: #f5f7fb;

  --text: #1f2937;

  --accent: #2563eb;
  --new: #059669;
  --upd: #d97706;
  --fail: #dc2626;

}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px 48px;
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);

}
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-size: 1.55rem; margin: 0 0 8px; letter-spacing: -0.02em; }
.explainer {

  font-size: 0.92rem;

}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: var(--card);

  border-radius: 12px;
  padding: 14px 16px;

}
.card .label { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.card .value { font-size: 1.45rem; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip {

  border-radius: 999px;
  font-size: 0.82rem;
  border: 1px solid var(--border);

}
.chip.ok { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
.chip.fail { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  align-items: center;
}
.filters input, .filters select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.9rem;
  background: var(--card);
}
.filters input { min-width: 220px; flex: 1; }
.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: auto;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td {
  padding: 10px 12px;
  text-align: left;
  font-size: 0.88rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
th {
  background: #f9fafb;
  position: sticky;
  top: 0;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
th:hover { background: #f3f4f6; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8fafc; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge.new { background: #d1fae5; color: #065f46; }
.badge.upd { background: #ffedd5; color: #9a3412; }
.muted { color: var(--muted); }
.empty { color: var(--muted); }
a.link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  white-space: nowrap;
}
a.link:hover { text-decoration: underline; }
.meta { font-size: 0.8rem; color: var(--muted); margin-top: 14px; }
.title-cell { font-weight: 500; max-width: 320px; }
.summary-cell { max-width: 240px; color: #374151; }
#count { font-size: 0.85rem; color: var(--muted); margin-left: 4px; }
</style>
</head>

<script>
(function() {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var tbody = document.getElementById('tbody');
  var qEl = document.getElementById('q');
  var kindEl = document.getElementById('kind');
  var sourceEl = document.getElementById('source');
  var countEl = document.getElementById('count');
  var sortCol = null;
  var sortAsc = true;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function disp(s) {
    var v = (s || '').trim();
    return v ? esc(v) : '<span class="empty">미확인</span>';
  }
  function badge(kind) {
    if (kind === 'NEW') return '<span class="badge new">신규</span>';
    if (kind === 'UPDATED') return '<span class="badge upd">변경</span>';
    return esc(kind);
  }
  function filtered() {
    var q = (qEl.value || '').toLowerCase().trim();
    var kind = kindEl.value;
    var source = sourceEl.value;
    return DATA.filter(function(r) {
      if (kind && r.kind !== kind) return false;
      if (source && r.source_id !== source) return false;
      if (!q) return true;
      var blob = [r.kind_ko, r.source_label, r.title, r.issuer, r.posted_at, r.deadline, r.summary].join(' ').toLowerCase();
      return blob.indexOf(q) >= 0;
    });
  }
  function render() {
    var rows = filtered();
    if (sortCol !== null) {
      var keys = ['kind_ko','source_label','title','issuer','posted_at','deadline','summary'];
      var key = keys[sortCol];
      rows = rows.slice().sort(function(a,b) {
        var x = (a[key] || ''), y = (b[key] || '');
        var cmp = x.localeCompare(y, 'ko');
        return sortAsc ? cmp : -cmp;
      });
    }
    countEl.textContent = '표시 ' + rows.length + ' / 전체 ' + DATA.length;
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="muted">조건에 맞는 공고가 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function(r) {
      return '<tr>'
        + '<td>' + badge(r.kind) + '</td>'
        + '<td>' + esc(r.source_label) + '</td>'
        + '<td class="title-cell">' + esc(r.title) + '</td>'
        + '<td>' + disp(r.issuer) + '</td>'
        + '<td>' + disp(r.posted_at) + '</td>'
        + '<td>' + disp(r.deadline) + '</td>'
        + '<td class="summary-cell">' + (r.summary ? esc(r.summary) : '<span class="empty">미확인</span>') + '</td>'
        + '<td><a class="link" href="' + esc(r.detail_url) + '" target="_blank" rel="noopener">원문 보기</a></td>'
        + '</tr>';
    }).join('');
  }
  qEl.addEventListener('input', render);
  kindEl.addEventListener('change', render);
  sourceEl.addEventListener('change', render);
  document.querySelectorAll('th[data-col]').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = parseInt(th.getAttribute('data-col'), 10);
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      render();
    });
  });
  render();
})();
</script>
